
name: Cloud Cost Gate

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  cost-check:
    name: Run Cloud Cost Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check GitHub OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Checking OIDC token availability..."
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo "OIDC URL available" || echo "OIDC URL missing"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" && echo "OIDC request token available" || echo "OIDC request token missing"

      - name: Inspect OIDC claims safely
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
          python -c '
          import sys, json, base64
          token = json.load(sys.stdin)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("Issuer:", claims.get("iss"))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989240881273:role/CloudCostGateGitHubRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Cloud Cost Gate
        id: cost_gate
        continue-on-error: true
        run: |
          python -m cloud_cost.cli examples/main.tf --budget 25 --report cost-report.md

      - name: Post cost report on Pull Request
        if: always() && github.event_name == 'pull_request' && hashFiles('cost-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('cost-report.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

      - name: Enforce budget result
        if: steps.cost_gate.outcome == 'failure'
        run: |
          echo "Cloud Cost Gate failed. The estimated cost exceeds the budget or the CLI encountered an error."
          exit 1
